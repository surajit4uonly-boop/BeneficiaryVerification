name: Build Standalone Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for build machine
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller openpyxl

      - name: Build one-file standalone EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name BeneficiaryVerification beneficiary_verification_app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeneficiaryVerification-Windows-x64
          path: dist/BeneficiaryVerification.exe
          if-no-files-found: error
          retention-days: 14
